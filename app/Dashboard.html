<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      padding-bottom: 80px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .user-menu {
      position: relative;
    }

    .user-name-btn {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 28px;
      right: 0;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      min-width: 140px;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .dropdown button {
      width: 100%;
      padding: 10px;
      background: none;
      border: none;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .dropdown button:hover {
      background: #f5f5f5;
    }

    /* ===== DASHBOARD ===== */
    header h1 {
      font-size: 18px;
      margin: 0;
    }

    header h2 {
      font-size: 14px;
      margin-top: 4px;
      font-weight: 400;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .card {
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 14px;
    }

    .card h3 {
      font-size: 11px;
      text-transform: uppercase;
      margin: 0;
    }

    .card p {
      font-size: 20px;
      font-weight: 700;
      margin: 4px 0 0;
    }

    .section-box1,
    .section-box2 {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #e6e6e6;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid #e6e6e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #999;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-item.active {
      color: #e60000;
    }

    .icon {
      font-size: 20px;
    }
  </style>
</head>

<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <strong>ChumaTrack</strong>

    <div class="user-menu">
      <button class="user-name-btn" id="userNameBtn">Loading...</button>

      <div class="dropdown" id="userDropdown">
        <button id="editNameBtn">Edit name</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <header>
    <h1>Dashboard</h1>
    <h2>Hello 👋</h2>
  </header>

  <div class="info-grid">
    <div class="card">
      <h3>Total Products</h3>
      <p>0</p>
    </div>
    <div class="card">
      <h3>Today's Sales</h3>
      <p>MK 0</p>
    </div>
    <div class="card">
      <h3>Inventory Value</h3>
      <p>MK 0</p>
    </div>
    <div class="card">
      <h3>Profit</h3>
      <p>MK 0</p>
    </div>
  </div>

  <div class="section-box1">
    ⚠️ Low stock alerts
  </div>

  <div class="section-box2">
    📈 High selling products
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="location.href='Dashboard.html'">
      <span class="icon">🏠</span>
    </button>
    <button class="nav-item" onclick="location.href='Sales.html'">
      <span class="icon">🛒</span>
    </button>
    <button class="nav-item" onclick="location.href='products.html'">
      <span class="icon">📦</span>
    </button>
    <button class="nav-item" onclick="location.href='analytics.html'">
      <span class="icon">📊</span>
    </button>
  </nav>

  <script>
    const API_BASE_URL = 'http://localhost:3000';
    const userNameBtn = document.getElementById('userNameBtn');
    const dropdown = document.getElementById('userDropdown');
    const editNameBtn = document.getElementById('editNameBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        location.href = '../auth/Landing.html';
        return false;
      }
      return token;
    }

    // Toggle dropdown
    userNameBtn.onclick = () => {
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    };

    // Load user data
    async function loadUser() {
      const token = checkAuth();
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/user`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch user');
        }

        const data = await response.json();
        const user = data.user;
        
        userNameBtn.textContent = user.user_metadata?.full_name || user.email;

        // Load dashboard data
        loadDashboardData(token);
      } catch (error) {
        console.error('Error loading user:', error);
        localStorage.removeItem('authToken');
        location.href = '../auth/Landing.html';
      }
    }

    // Load dashboard statistics
    async function loadDashboardData(token) {
      try {
        const response = await fetch(`${API_BASE_URL}/app/products`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (response.ok) {
          const data = await response.json();
          const products = data.products || [];
          
          // Update total products
          document.querySelector('.card:nth-child(1) p').textContent = products.length;
          
          // Calculate inventory value
          const inventoryValue = products.reduce((sum, p) => sum + (p.price * p.quantity), 0);
          document.querySelector('.card:nth-child(3) p').textContent = `MK ${inventoryValue.toFixed(2)}`;
        }
      } catch (error) {
        console.error('Error loading dashboard data:', error);
      }
    }

    loadUser();

    // Edit name
    editNameBtn.onclick = async () => {
      const newName = prompt('Enter your name:', userNameBtn.textContent);
      if (!newName) return;

      const token = checkAuth();
      if (!token) return;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/update-profile`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullName: newName.trim() })
        });

        if (response.ok) {
          userNameBtn.textContent = newName.trim();
          dropdown.style.display = 'none';
        }
      } catch (error) {
        console.error('Error updating name:', error);
        alert('Failed to update name');
      }
    };

    // Logout
    logoutBtn.onclick = async () => {
      const token = checkAuth();
      if (!token) return;

      try {
        await fetch(`${API_BASE_URL}/auth/signout`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
      } catch (error) {
        console.error('Logout error:', error);
      } finally {
        localStorage.removeItem('authToken');
        localStorage.removeItem('user');
        location.href = '../auth/Landing.html';
      }
    };

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.user-menu')) {
        dropdown.style.display = 'none';
      }
    });
  </script>

</body>
</html>
