<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory</title>

    <script>
  function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
  }
    </script>
    <style>
      h1 {
        text-align: center;
      }

      h2 {
        text-align: center;
      }

      p {
        text-align: center;
      }
      #password {
        text-align: left;
        margin-left: 5px;
      }

      #email {
        text-align: left;
        margin-left: 5px;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      .separator {
        display: flex;
        align-items: center;
        text-align: center;
        color: #888;
        font-size: 14px;
        margin: 20px 0;
      }

      .separator::before,
      .separator::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #eee;
      }

      .separator:not(:empty)::before {
        margin-right: 10px;
      }
      .separator:not(:empty)::after {
        margin-left: 10px;
      }

      input,
      button {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        margin: 8px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        box-sizing: border-box;
      }

      .login {
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      #continue {
        background-color: #18751b;
        color: white;
        border: none;
        cursor: pointer;
      }

      #continue:hover {
        background-color: #145a16;
      }

      #continue:disabled {
        background-color: #6aad6c;
        cursor: not-allowed;
      }

      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: #1f1f1f;
        border: 1px solid #747775;
        border-radius: 4px;
        padding: 10px 16px;
        font-family: "Roboto", sans-serif;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .google-btn:hover {
        background-color: #f8f9fa;
      }

      .google-btn:disabled {
        background-color: #f8f9fa;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .google-btn svg {
        width: 18px;
        height: 18px;
        margin-right: 10px;
      }

      .password-wrapper {
        position: relative;
        width: 100%;
      }

      .password-wrapper input {
        padding-right: 45px;
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
        user-select: none;
        color: #666;
      }
      .toggle-password:hover { color: #000; }


      .error-message {
        display: none;
        color: #d32f2f;
        background-color: #ffebee;
        padding: 10px;
        border-radius: 5px;
        margin: 10px 0;
        font-size: 14px;
        text-align: left;
        border-left: 4px solid #d32f2f;
      }

      @media screen and (max-width: 600px) {
        body {
          padding-top: 20px; 
        }

        h1 {
          font-size: 1.5rem; 
        }
      }
    </style>
  </head>

  <body>
    <h1>INVENTORY MANAGEMENT</h1>

    <div class="login">
      <h2>Login</h2>
      <p>Enter your email and password to sign in for this app</p>
      <p id="email">Email</p>
      <input type="email" id="emailInput" placeholder="email@domain.com" />

      <p id="password">Password</p>
      <div class="password-wrapper">
        <input type="password" id="passwordInput" placeholder="password" />
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('passwordInput', this)"></i>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <button id="continue">Sign in</button>

      <div class="separator">or</div>

      <button class="google-btn" id="googleSignIn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid"
          viewBox="0 0 256 262"
        >
          <path
            fill="#4285F4"
            d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"
          />
          <path
            fill="#34A853"
            d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.054-45.257 13.054-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"
          />
          <path
            fill="#FBBC05"
            d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.261 71.93l-1.445.69C4.641 93.508 0 111.495 0 130.55s4.641 37.043 13.816 57.928l42.465-32.109"
          />
          <path
            fill="#EA4335"
            d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.816 72.62l42.465 32.109c10.445-31.477 39.746-54.25 74.269-54.25"
          />
        </svg>
        <span>Continue with Google</span>
      </button>


      <p>Don't have an Account? <a href="Signup.html">Sign up</a></p>
      <p>
        By clicking Sign in you agree to our Terms of Service and Privacy policy
      </p>
    </div>
     
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
      const { createClient } = supabase;

      const supabaseClient = createClient(
        'https://vvaveobusmzlughhxgcf.supabase.co',
        'sb_publishable_fV0b1w74R4IfJw_7mehjqg_4f5LitDl'  
      );

      console.log('Landing.html: Supabase client initialized →', !!supabaseClient);


      //SIGN IN WITH EMAIL AND PASSWORD
      async function signInWithEmail() {
        const errorMsg = document.getElementById('errorMessage');
        const btn = document.getElementById('continue');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          errorMsg.textContent = 'Please enter both email and password';
          errorMsg.style.display = 'block';
          return;
        }

        errorMsg.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;

          alert('Welcome back! You are now signed in.');
          window.location.href = 'Dashboard.html';

        } catch (err) {
          errorMsg.textContent = err.message || 'Login failed – check your credentials';
          errorMsg.style.display = 'block';
          console.error('Login error:', err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      }

      //SIGN IN WITH GOOGLE OAUTH
      async function signInWithGoogle() {
        const errorMsg = document.getElementById('errorMessage');
        const btn = document.getElementById('googleSignIn');

        errorMsg.style.display = 'none';
        btn.disabled = true;

        try {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/Dashboard.html'
            }
          });

          if (error) throw error;

        } catch (err) {
          errorMsg.textContent = err.message || 'Google sign-in failed';
          errorMsg.style.display = 'block';
          console.error('Google OAuth error:', err);
          btn.disabled = false;
        }
      }

      
      document.getElementById('continue').addEventListener('click', signInWithEmail);
      document.getElementById('googleSignIn').addEventListener('click', signInWithGoogle);

  
    </script>
  </body>
</html>
