<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Sign Up</title>

    <script>
        window.alert = function (message) {
            const overlay = document.createElement('div');
            overlay.className = 'custom-alert-overlay';

            overlay.innerHTML = `
            <div class="custom-alert">
                <i class="fa-solid fa-circle-check"></i>
                <p>${message}</p>
                <button>OK</button>
            </div>
          `;

            overlay.querySelector('button').onclick = () => {
                document.body.removeChild(overlay);
            };

            document.body.appendChild(overlay);
        };
    </script>

    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        function checkPasswordMatch() {
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMessage');
            if (confirmPassword === '') {
                errorMsg.style.display = 'none';
            } else if (password !== confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Passwords do not match!';
            } else {
                errorMsg.style.display = 'none';
            }
        }
    </script>

    <style>
        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        #password {
            text-align: left;
            margin-left: 5px;
        }

        .business {
            text-align: left;
            margin-left: 5px;
        }

        #firstname {
            text-align: left;
            margin-left: 5px;
        }

        #lastname {
            text-align: left;
            margin-left: 5px;
        }

        #email {
            text-align: left;
            margin-left: 5px;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        input,
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .signup {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #continue {
            background-color: #18751b;
            color: white;
            border: none;
            cursor: pointer;
        }

        #continue:hover {
            background-color: #145a16;
        }

        #continue:disabled {
            background-color: #6aad6c;
            cursor: not-allowed;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            color: #666;
        }

        .toggle-password:hover {
            color: #000;
        }

        .error-message {
            display: none;
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
            text-align: left;
            border-left: 4px solid #d32f2f;
        }

        /* Custom Alert Styles */
        .custom-alert-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .custom-alert {
            background: #fff;
            width: 90%;
            max-width: 360px;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            animation: scaleIn 0.25s ease;
        }

        .custom-alert i {
            font-size: 42px;
            color: #18751b;
            margin-bottom: 12px;
        }

        .custom-alert p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }

        .custom-alert button {
            background: #18751b;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .custom-alert button:hover {
            background: #145a16;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <h1>ChumaTrack</h1>

    <div class="signup">
        <h2>Sign Up</h2>
        <p>Create your account by filling in the information below</p>

        <p id="firstname">First Name</p>
        <input type="text" id="firstNameInput" placeholder="Enter first name">

        <p id="lastname">Last Name</p>
        <input type="text" id="lastNameInput" placeholder="Enter last name">

        <p class="business">Business name</p>
        <input type="text" id="businessNameInput" placeholder="Enter Business Name">

        <p class="business">Phone Number</p>
        <input type="tel" id="phoneNumberInput" placeholder="Phone Number">

        <p id="email">Email</p>
        <input type="email" id="emailInput" placeholder="email@domain.com">

        <p id="password">Password</p>
        <div class="password-wrapper">
            <input type="password" id="passwordInput" placeholder="Enter your Password" oninput="checkPasswordMatch()">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('passwordInput', this)"></i>
        </div>

        <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" oninput="checkPasswordMatch()">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <button id="continue" onclick="handleSignup()">Sign Up</button>

        <p>Already have an Account? <a href="Landing.html">Log in</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        const { createClient } = supabase;

        // FIXED: Use your actual Supabase anon key
        const supabaseClient = createClient(
            'https://vvaveobusmzlughhxgcf.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZlb2J1c216bHVnaGh4Z2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0OTg3MDcsImV4cCI6MjA4NDA3NDcwN30.25zYCjVAeQIkhD3n81jjZ6M5P2b-yUp-ZL4Y3hvlZV4'
        );

        async function handleSignup() {
            const errorMsg = document.getElementById('errorMessage');
            const btn = document.getElementById('continue');

            // FIXED: Use proper input IDs for selection
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
            const businessName = document.getElementById('businessNameInput').value.trim();
            const phoneNumber = document.getElementById('phoneNumberInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!firstName || !lastName || !businessName || !phoneNumber || !email || !password || !confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please fill in all fields';
                return;
            }

            if (password.length < 8) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Password must be at least 8 characters long';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Passwords do not match!';
                return;
            }

            // ADDED: Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please enter a valid email address';
                return;
            }

            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing up...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    full_name: `${firstName} ${lastName}`.trim(),
                    business_name: businessName,
                    phone: phoneNumber


                });

                if (error) throw error;

                if (data.user) {
                    if (data.session) {
                        alert('Account created! You are now signed in.');
                        window.location.href = 'Dashboard.html';
                    } else {
                        alert('Account created! Please check your email and click the confirmation link.');
                        // FIXED: Redirect to login after email confirmation message
                        setTimeout(() => {
                            window.location.href = 'Landing.html';
                        }, 3000);
                    }
                }

            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = err.message || 'Signup failed - please try again';
                console.error('Signup error:', err);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        }

        // ADDED: Allow Enter key to submit form
        document.getElementById('confirmPassword').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSignup();
            }
        });
    </script>
</body>

</html>
