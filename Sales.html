<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Sales</title>
    </head>

   <body>
     <header>
        <h1>Inventory Management</h1>
        <p>Manage your shop's inventory and track sales in one place</p>
     </header>

     <section class="sales-container">
      <div class="header">
        <h2>Sales History</h2>
        <button id="sale-record">+Record sale</button>
      </div>

      <div id="form-modal" class="hidden">
         <h3>Add Sale</h3>
         <form id="sale-form">
          <input type="text" id="product" placeholder="Product Name" required>
          <input type="text" id="unit-price" placeholder="Unit Price" required>
          <input type="text" id="quantity" placeholder="Quantity" required>
          <button type="submit">Add to Table</button>
          <button type="button" id="cancel-btn">Cancel</button>

         </form>
      </div>

      <div class="table-container">
        <table class="records-table">
            <thead>
                <tr>
                    <th>Date and time</th>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="body">

            </tbody>
        </table>
      </div>
     </section>

      <nav class="bottom-nav">
            <button class="nav-item">
                <span class="icon">🏠</span>
            </button>

            <button class="nav-item active">
                <span class="icon">🛒</span>
            </button>

            <button class="nav-item ">
                <span class="icon">📦</span>
            </button>
            
            <button class="nav-item">
                <span class="icon">📊</span>
            </button>

   </body>

</html>

<script>
    const addBtn = document.getElementById('sale-record');
    const formModal = document.getElementById('form-modal');
    const cancelBtn = document.getElementById('cancel-btn');
    const form = document.getElementById('sale-form');
    const tableBody = document.getElementById('body');

    addBtn.addEventListener('click', function(){
        formModal.classList.remove('hidden');
    });

     cancelBtn.addEventListener('click', function() {
            formModal.classList.add('hidden');  // Hide form
    });

    form.addEventListener('submit', function(e) {
            e.preventDefault();  // Stop page refresh
            
            // Get values from form
            const product = document.getElementById('product').value;
            const price = document.getElementById('unit-price').value;
            const quantity = document.getElementById('quantity').value;
            
            // Calculate total
            const total = price * quantity;
            
            // Get current date/time
            const now = new Date().toLocaleString();
            
            // Create new table row
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${now}</td>
                <td>${product}</td>
                <td>${price}</td>
                <td>${quantity}</td>
                <td>${total}</td>
            `;
            
            // Add row to table
            tableBody.appendChild(newRow);
            
            // Clear form inputs
            form.reset();
            
            // Hide form
            formModal.classList.add('hidden');
    });        
        


</script>
